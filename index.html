<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>기수정렬 버킷 퍼즐</title>
  <link rel="stylesheet" href="style.css?v=326378" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>기수정렬 버킷 퍼즐</h1>
        <p id="storyTitle" class="story-title muted"></p>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">레벨</span><span id="level" class="value">1</span></div>
        <div class="stat"><span class="label">점수</span><span id="score" class="value">0</span></div>
        <div class="stat"><span class="label">콤보</span><span id="combo" class="value">0</span></div>
        <div class="stat"><span class="label">최고</span><span id="best" class="value">0</span></div>
        <div class="stat"><span class="label">목숨</span><span id="lives" class="value lives"></span></div>
      </div>
    </header>

    <section class="narrator" aria-live="polite">
      <div id="narratorFace" class="narrator-face"></div>
      <div class="narrator-bubble">
        <span class="narrator-name">기수 반장</span>
        <p id="instruction"></p>
      </div>
    </section>

    <section class="passes" aria-label="정렬 단계">
      <ol id="passList"></ol>
    </section>

    <section class="queue-wrap" aria-label="대기열">
      <div class="queue-head">
        <span>대기 줄</span>
        <span id="queueCount" class="muted"></span>
      </div>
      <div id="queue" class="queue"></div>
    </section>

    <section id="buckets" class="buckets" aria-label="버킷 0~9"></section>

    <div class="controls">
      <button id="collectBtn" class="btn primary" disabled>다시 줄 세우기 <kbd>Space</kbd></button>
      <button id="restartBtn" class="btn">레벨 다시 시작</button>
    </div>

    <p class="help muted">맨 앞 사람 번호표의 <b>강조된 자리 숫자</b>와 같은 방을 누르세요. 키보드 <kbd>0</kbd>~<kbd>9</kbd>도 됩니다.</p>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button id="modalBtn" class="btn primary"></button>
    </div>
  </div>

  <script src="game.js?v=326378"></script>
</body>
</html>
